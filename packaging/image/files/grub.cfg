# AI Linux A/B boot logic (experimental prototype). The data partition is never touched here.
set timeout=3
search --no-floppy --label AILX-ESP --set esp
set envfile=($esp)/EFI/ubuntu/grubenv
load_env --file $envfile
if [ -z "$default_slot" ]; then set default_slot=A; fi
set slot=$default_slot
set trial=0
if [ -n "$next_slot" ]; then
  # one-time trial boot: clear next_slot BEFORE booting so a failed boot falls back automatically
  set slot=$next_slot
  set trial=1
  set trial_slot=$next_slot
  set trial_result=pending
  set next_slot=
  save_env --file $envfile next_slot trial_slot trial_result
fi

function boot_slot {
  search --no-floppy --label ailx-root$1 --set root
  echo "AI Linux: booting slot $1 (trial=$2)"
  linux /boot/vmlinuz root=LABEL=ailx-root$1 rw ailx.slot=$1 ailx.trial=$2 console=tty0 console=ttyS0,115200 panic=10
  initrd /boot/initrd.img
}

menuentry "AI Linux (slot $slot)" { boot_slot $slot $trial }
menuentry "AI Linux slot A" { boot_slot A 0 }
menuentry "AI Linux slot B" { boot_slot B 0 }

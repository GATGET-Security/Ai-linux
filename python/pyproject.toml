[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ailx-bench"
version = "0.2.0"
description = "AI Linux measurement foundation: hardware probe, benchmark harness, statistics, telemetry, quality gate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "AI Linux contributors" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "jsonschema>=4.23",
  "rfc8785>=0.1.4",
  "zstandard>=0.23",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.560"]
gguf = ["gguf>=0.10"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "gguf>=0.10", "nvidia-ml-py>=12.560"]

[project.scripts]
ailx-bench = "ailx.cli:main"
ailx = "ailx.system.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ailx"]

[tool.hatch.build.targets.wheel.force-include]
"../schemas" = "ailx/_schemas"
"../helpers" = "ailx/_helpers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ailx"]

[[tool.mypy.overrides]]
module = ["scipy.*", "rfc8785", "zstandard", "pynvml", "gguf", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: simulation-heavy tests",
  "llamacpp: needs llama.cpp binaries (AILX_LLAMA_CPP_BIN) and a tiny GGUF model",
]
